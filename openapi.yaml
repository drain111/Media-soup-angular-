openapi: 3.0.3
info:
  title: mediasoupangular API
  description: >
    Routes for the mediasoup voice chat app.
    REST endpoints are served by the Express server on :3001.
    Realtime signalling after you create/join a room uses the Socket.IO
    connection at /ws.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Local dev server

paths:
  /api/auth/providers:
    get:
      tags: [Auth]
      summary: Get available OAuth providers
      description: Returns the list of configured OAuth providers.
      operationId: getProviders
      responses:
        '200':
          description: List of OAuth providers
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/{provider}/login-url:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
        description: OAuth provider ID (e.g. "google")
    get:
      tags: [Auth]
      summary: Get the OAuth login URL for a provider
      description: >
        Returns the OAuth consent screen URL you should redirect to.
        The redirect comes back to /api/auth/{provider}/callback with ?code.
      operationId: getLoginUrl
      responses:
        '200':
          description: The URL to open for OAuth sign-in
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: Full OAuth consent screen URL
        '404':
          description: Unknown provider

  /api/auth/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
        description: OAuth provider ID (e.g. "google")
    get:
      tags: [Auth]
      summary: OAuth redirect target
      description: >
        Handles ?code from the provider, exchanges it for tokens, sets the
        session cookie, then redirects to /.
      operationId: oauthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: Authorization code from the provider
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect to / after the cookie is set
          headers:
            Location:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/session:
    get:
      tags: [Session]
      summary: Get current logged-in user
      description: Returns the current session user profile. 401 when not logged in.
      operationId: getCurrentSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The current user's profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [Session]
      summary: Log out the current session
      description: Clears the session cookie and invalidates the login.
      operationId: deleteCurrentSession
      responses:
        '204':
          description: Cookie cleared, no content returned
  /auth/error:
    get:
      tags: [Client]
      summary: OAuth authentication error page
      description: >
        Angular client-side route displayed when an OAuth login fails.
        Rendered via SSR. Accepts `message` and `provider` query parameters
        to display the error details.
      parameters:
        - name: message
          in: query
          required: false
          schema: { type: string }
          description: Human-readable error message from the OAuth provider
        - name: provider
          in: query
          required: false
          schema: { type: string }
          description: OAuth provider ID that failed

  /api/rooms:
    post:
      tags: [Rooms]
      summary: Create a room
      description: >
        Creates a new room for the authenticated user. The server generates a 
        unique 6-character code. The frontend navigates to `/call?code=<code>`
        on success where the Socket.IO WebSocket connection begins.
      operationId: createRoom
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRoomResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/{code}:
    post:
      tags: [Rooms]
      summary: Join an existing room via WebSocket handshake
      description: >
        Joins a room by its code. The session must already exist on the server.
        This endpoint does **not** create new rooms — use `POST /api/rooms` for creation.
        After joining, the frontend establishes a Socket.IO connection at `/ws`
        for mediasoup signalling.
      operationId: joinRoomSession
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: A1B2C3 }
          description: 6-character room code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRoomRequest' }
      responses:
        '200':
          description: Room session retrieved; use Socket.IO `/ws` to begin signalling
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomInfo' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room not found

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    User:
      type: object
      required: [email, name]
      properties:
        email:   { type: string, format: email }
        name:    { type: string }
        picture:
          type: string
          format: uri
          description: Google profile picture URL

    RoomResponse:
      allOf:
        - $ref: '#/components/schemas/RoomCode'
        - type: object
          properties:
            isHost:
              type: boolean
              description: Whether you are the room host (true = created)
            expiresAt:
              type: integer
              description: Room expiry as epoch seconds
            invites:
              type: array
              items: { type: string, format: email }

    CreateRoomRequest:
      type: object
      required: [roomName, inviteEmails]
      properties:
        roomName:
          type: string
          description: Display name for the room
        inviteEmails:
          type: array
          items: { type: string, format: email }
          description: Email whitelist of allowed participants

    CreateRoomResponse:
      allOf:
        - $ref: '#/components/schemas/RoomCode'

    JoinRoomRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          description: Name to display in the room

    RoomInfo:
      allOf:
        - $ref: '#/components/schemas/RoomCode'
        - $ref: '#/components/schemas/RoomResponse'

    RoomCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: A1B2C3
          description: 6-character room code

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
